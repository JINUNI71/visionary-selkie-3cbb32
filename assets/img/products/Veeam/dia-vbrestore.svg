<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="322" viewBox="-6 -6 912 322" role="img" aria-label="복구 경로 네 갈래">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect x="-6" y="-6" width="912" height="322" fill="#ffffff"/>
    <text x="0" y="14" class="l">하나의 백업본</text>
    <rect x="0" y="26" width="200" height="180" fill="#1e8e3e" opacity=".07"/>
    <rect x="0" y="26" width="200" height="180" fill="none" stroke="#1e8e3e" stroke-width="1.2"/>
    <text x="18" y="108" class="t" fill="#1e8e3e">백업 복원 지점</text>
    <text x="18" y="130" class="s">네 갈래 복구 경로로 분기합니다</text>
    
      <rect x="260" y="26" width="640" height="38" class="k"/>
      <text x="278" y="50" class="t" font-size="12.5">즉시 기동</text>
      <text x="440" y="50" class="s">서비스 재개용이며 원복 수단은 아님</text>
      <text x="820" y="50" class="s" fill="#1e8e3e">분 단위</text>
      <path d="M200 45h60" stroke="#1e8e3e" stroke-width="1.2" opacity=".5" fill="none"/>
      <rect x="260" y="72" width="640" height="38" class="k"/>
      <text x="278" y="96" class="t" font-size="12.5">항목 단위 복구</text>
      <text x="440" y="96" class="s">파일 · 메일 · DB 테이블 · 시점</text>
      <text x="820" y="96" class="s" fill="#1e8e3e">분 단위</text>
      <path d="M200 91h60" stroke="#1e8e3e" stroke-width="1.2" opacity=".5" fill="none"/>
      <rect x="260" y="118" width="640" height="38" class="k"/>
      <text x="278" y="142" class="t" font-size="12.5">전체 복구</text>
      <text x="440" y="142" class="s">다른 플랫폼으로도 내보내기</text>
      <text x="820" y="142" class="s" fill="#1e8e3e">시간 단위</text>
      <path d="M200 137h60" stroke="#1e8e3e" stroke-width="1.2" opacity=".5" fill="none"/>
      <rect x="260" y="164" width="640" height="38" class="k"/>
      <text x="278" y="188" class="t" font-size="12.5">베어메탈 복구</text>
      <text x="440" y="188" class="s">이기종 하드웨어 · 다른 디스크</text>
      <text x="820" y="188" class="s" fill="#1e8e3e">시간 단위</text>
      <path d="M200 183h60" stroke="#1e8e3e" stroke-width="1.2" opacity=".5" fill="none"/>
    <rect x="0" y="232" width="900" height="72" class="k"/>
    <text x="18" y="258" class="t">업무별로 기본 복구 경로를 하나씩 지정해 문서화합니다</text>
    <text x="18" y="280" class="s" font-size="12.5">즉시 기동은 서비스 재개용이므로 운영 스토리지로 이전하는 단계까지 단일 절차로 작성합니다.</text>
    <text x="18" y="298" class="s" font-size="12.5">지정한 경로는 분기마다 실제로 수행해 소요 시간을 재측정합니다.</text>
  </svg>
