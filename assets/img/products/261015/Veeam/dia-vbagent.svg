<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="에이전트 배포와 베어메탈 복구">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect width="100%" height="100%" fill="#ffffff"/>
    <text x="0" y="14" class="l">배포</text>
    <g class="k"><rect x="0" y="26" width="200" height="54" rx="0"/><rect x="230" y="26" width="200" height="54" rx="0"/><rect x="460" y="26" width="200" height="54" rx="0"/><rect x="690" y="26" width="210" height="54" rx="0"/></g>
    <g class="t" font-size="12.5"><text x="18" y="50">콘솔에서 일괄 배포</text><text x="248" y="50">설치 패키지 전송</text><text x="478" y="50">에이전트 설치</text><text x="708" y="50">재스캔으로 확인</text></g>
    <g class="s"><text x="18" y="70">대상 서버 선택</text><text x="248" y="70">원격 전송</text><text x="478" y="70">자동 진행</text><text x="708" y="70">실패 건만 개별 처리</text></g>
    <g stroke="#1e8e3e" stroke-width="1.2" opacity=".5" fill="none"><path d="M200 53h30M430 53h30M660 53h30"/></g>
    <text x="0" y="122" class="l">백업 범위</text>
    <g class="k"><rect x="0" y="134" width="290" height="50" rx="0"/><rect x="305" y="134" width="290" height="50" rx="0"/><rect x="610" y="134" width="290" height="50" rx="0"/></g>
    <g class="t" font-size="12.5"><text x="18" y="158">전체 이미지</text><text x="323" y="158">볼륨 단위</text><text x="628" y="158">파일 단위</text></g>
    <g class="s"><text x="18" y="176">베어메탈 복구 가능</text><text x="323" y="176">선택한 볼륨만</text><text x="628" y="176">지정 경로만</text></g>
    <rect x="0" y="206" width="900" height="80" fill="#1e8e3e" opacity=".06"/>
    <text x="18" y="232" class="t" fill="#1e8e3e">이기종 복원</text>
    <text x="18" y="254" class="s" font-size="12.5">복구 미디어로 부팅하면 원래와 다른 하드웨어, 다른 용량의 디스크로도 되돌릴 수 있습니다.</text>
    <text x="18" y="274" class="s" font-size="12.5">디스크 매핑을 수동으로 지정해야 하는 경우가 있어, 대상 서버별 매핑 기준을 미리 정리해 둡니다.</text>
  </svg>
