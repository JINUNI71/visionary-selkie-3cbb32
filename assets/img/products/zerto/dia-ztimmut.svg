<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="302" viewBox="-6 -6 912 302" role="img" aria-label="불변 사본 생성">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect x="-6" y="-6" width="912" height="302" fill="#ffffff"/>
    <text x="0" y="14" class="l">저널 시점 사본의 고정</text>
    <g class="k"><rect x="0" y="26" width="200" height="60" rx="0"/><rect x="240" y="26" width="200" height="60" rx="0"/><rect x="480" y="26" width="200" height="60" rx="0"/><rect x="720" y="26" width="180" height="60" rx="0"/></g>
    <g class="t" font-size="12.5"><text x="18" y="50">저널</text><text x="258" y="50">시점 선택</text><text x="498" y="50">사본 생성</text><text x="738" y="50">불변 잠금</text></g>
    <g class="s"><text x="18" y="72">초 단위 체크포인트</text><text x="258" y="72">복구할 시점 지정</text><text x="498" y="72">오브젝트 저장소로</text><text x="738" y="72">보존 기간 동안</text></g>
    <g stroke="#d93025" stroke-width="1.3" opacity=".55" fill="none"><path d="M200 56h40M440 56h40M680 56h40"/><path d="M228 50l10 6-10 6M468 50l10 6-10 6M708 50l10 6-10 6"/></g>
    <rect x="0" y="112" width="440" height="66" class="k"/>
    <text x="18" y="138" class="t">운영 디스크를 복사하지 않습니다</text>
    <text x="18" y="160" class="s" font-size="12.5">저널의 시점본을 사용하므로 운영에 부하를 주지 않습니다.</text>
    <rect x="460" y="112" width="440" height="66" fill="#d93025" opacity=".07"/>
    <rect x="460" y="112" width="440" height="66" fill="none" stroke="#d93025" stroke-width="1"/>
    <text x="478" y="138" class="t" fill="#d93025">지울 수 없습니다</text>
    <text x="478" y="160" class="s" font-size="12.5">보존 기간 안에는 관리자 권한으로도 삭제되지 않습니다.</text>
    <rect x="0" y="200" width="900" height="82" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
    <text x="18" y="226" class="t">재해복구 사본과 장기 보관 사본은 대응 대상 사고가 다릅니다</text>
    <text x="18" y="248" class="s" font-size="12.5">두 계층을 혼용하지 않고 각각의 역할을 분리해 설계합니다.</text>
    <text x="18" y="270" class="s" font-size="12.5">3-2-1-1-0 원칙을 어느 계층에서 충족하는지 문서에 명시합니다.</text>
  </svg>
