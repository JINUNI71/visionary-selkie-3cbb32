    <text x="800" y="98" class="s" font-size="10.5" fill="#d93025">최신 시점</text>
    <g stroke="#d93025" stroke-width="1.6" fill="none"><path d="M880 64h20"/><path d="M866 58l10 6-10 6"/></g>
    <g stroke="#9aa0a6" stroke-width="1.4" fill="none"><path d="M20 64H0"/><path d="M14 58l-10 6 10 6"/></g>
    <text x="0" y="128" class="s" font-size="11">순차 삭제</text>
    <text x="790" y="128" class="s" font-size="11">새 체크포인트</text>
    <rect x="0" y="148" width="290" height="62" class="k"/>
    <text x="18" y="174" class="t" fill="#d93025">5~15초</text>
    <text x="18" y="196" class="s" font-size="12">체크포인트 생성 주기</text>
    <rect x="305" y="148" width="290" height="62" class="k"/>
