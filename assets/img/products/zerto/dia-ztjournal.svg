    <rect x="0" y="232" width="900" height="62" fill="#d93025" opacity=".06"/>
    <text x="18" y="258" class="s" font-size="12.5" fill="#d93025">저널 용량은 견적 단계에서 추정하지 않고, 변경률을 실측해 역산합니다.</text>
    <text x="18" y="280" class="s" font-size="12.5">보존 기간을 변경하면 그 시점에 다시 계산하고, 업무 등급별로 다르게 산정해 용량과 비용을 맞춥니다.</text>
