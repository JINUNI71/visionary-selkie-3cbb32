<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="312" viewBox="-6 -6 912 312" role="img" aria-label="암호화 이상 탐지 시점 비교">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect x="-6" y="-6" width="912" height="312" fill="#ffffff"/>
    <text x="0" y="14" class="l">감염 발생 이후의 탐지 시점</text>
    <line x1="0" y1="70" x2="900" y2="70" stroke="#dadce0" stroke-width="1"/>
    <rect x="60" y="54" width="4" height="32" fill="#b06000"/>
    <text x="60" y="46" class="s" font-size="11" fill="#b06000">감염 시작</text>
    <rect x="130" y="54" width="4" height="32" fill="#d93025"/>
    <text x="130" y="46" class="s" font-size="11" fill="#d93025">복제 경로에서 탐지</text>
    <rect x="700" y="54" width="4" height="32" fill="#9aa0a6"/>
    <text x="620" y="46" class="s" font-size="11">다음 백업 스캔 시점</text>
    <g stroke="#d93025" stroke-width="1.6" fill="none"><path d="M62 100h68"/><path d="M120 94l10 6-10 6"/></g>
    <text x="140" y="104" class="s" font-size="11.5" fill="#d93025">짧은 되돌림 구간</text>
    <g stroke="#9aa0a6" stroke-width="1.3" fill="none" stroke-dasharray="4 3"><path d="M62 126h638"/><path d="M690 120l10 6-10 6"/></g>
    <text x="330" y="120" class="s" font-size="11.5">백업 기반 탐지: 다음 주기까지 대기</text>
    <rect x="0" y="152" width="440" height="62" fill="#d93025" opacity=".07"/>
    <rect x="0" y="152" width="440" height="62" fill="none" stroke="#d93025" stroke-width="1"/>
    <text x="18" y="178" class="t" fill="#d93025">복제 경로 위에서 판정</text>
    <text x="18" y="200" class="s" font-size="12.5">쓰기 패턴을 분석해 체크포인트에 표시를 남깁니다.</text>
    <rect x="460" y="152" width="440" height="62" class="k"/>
    <text x="478" y="178" class="t">되돌릴 지점</text>
    <text x="478" y="200" class="s" font-size="12.5">표시 직전의 정상 체크포인트로 복구합니다.</text>
    <rect x="0" y="236" width="900" height="60" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
    <text x="18" y="262" class="s" font-size="12.5">탐지를 알림으로 끝내지 않고, 감염 직전 시점을 찾는 절차와 사고 후 분석용 격리 환경까지 절차서에 포함합니다.</text>
    <text x="18" y="284" class="s" font-size="12.5">탐지 이후 누가 무엇을 판단하는지도 함께 정합니다.</text>
  </svg>
