<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="312" viewBox="-6 -6 912 312" role="img" aria-label="무중단 전환 훈련">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect x="-6" y="-6" width="912" height="312" fill="#ffffff"/>
    <text x="0" y="14" class="l">운영 사이트: 현행 유지</text>
    <rect x="0" y="26" width="300" height="110" class="k"/>
    <text x="18" y="52" class="t">운영 중</text>
    <text x="18" y="76" class="s">서비스 계속</text>
    <text x="18" y="98" class="s" fill="#d93025">복제도 계속 진행</text>
    <text x="18" y="120" class="s">테스트가 운영을 멈추지 않습니다</text>
    <g stroke="#d93025" stroke-width="1.6" fill="none"><path d="M300 80h60"/><path d="M350 74l10 6-10 6"/></g>
    <text x="400" y="14" class="l" fill="#d93025">DR 사이트: 격리망에서만</text>
    <rect x="400" y="26" width="500" height="110" fill="#d93025" opacity=".06"/>
    <rect x="400" y="26" width="500" height="110" fill="none" stroke="#d93025" stroke-width="1.3" stroke-dasharray="5 4"/>
    <g fill="#fff" stroke="#dadce0" stroke-width="1"><rect x="420" y="46" width="140" height="44" rx="0"/><rect x="576" y="46" width="140" height="44" rx="0"/><rect x="732" y="46" width="148" height="44" rx="0"/></g>
    <g class="s" text-anchor="middle" font-size="11"><text x="490" y="72">테스트 VM</text><text x="646" y="72">테스트 VM</text><text x="806" y="72">테스트 VM</text></g>
    <text x="420" y="112" class="s" font-size="11.5" fill="#d93025">격리 네트워크: 운영망과 분리</text>
    <text x="420" y="130" class="s" font-size="11.5">테스트 중 쓰기는 별도 영역에 기록됩니다</text>
    <rect x="0" y="162" width="440" height="58" class="k"/>
    <text x="18" y="188" class="t">연 1~2회 대행</text>
    <text x="18" y="208" class="s" font-size="12.5">훈련 계획 수립부터 실행까지</text>
    <rect x="460" y="162" width="440" height="58" fill="#d93025" opacity=".07"/>
    <rect x="460" y="162" width="440" height="58" fill="none" stroke="#d93025" stroke-width="1"/>
    <text x="478" y="188" class="t" fill="#d93025">실측 복구 시간 리포트</text>
    <text x="478" y="208" class="s" font-size="12.5">단계별 소요 시간과 성공 여부를 기록</text>
    <rect x="0" y="242" width="900" height="52" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
    <text x="18" y="268" class="s" font-size="12.5">훈련에서 나온 문제를 반영해 절차서를 갱신하는 것까지가 범위입니다.</text>
    <text x="18" y="288" class="s" font-size="12.5">복구 가능성은 주장이 아니라 리포트로 증명합니다.</text>
  </svg>
