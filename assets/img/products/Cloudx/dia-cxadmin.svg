    <rect x="464" y="24" width="436" height="236" fill="#f8f9fa"/>
    <rect x="464" y="24" width="436" height="236" fill="none" stroke="#c9ced6" stroke-width="1.2"/>
    <text x="480" y="44" class="s" font-size="11.5">Super Admin: 전체 범위</text>

    <g class="k"><rect x="16" y="56" width="204" height="58" rx="0"/><rect x="232" y="56" width="204" height="58" rx="0"/><rect x="480" y="56" width="200" height="58" rx="0"/><rect x="692" y="56" width="192" height="58" rx="0"/>
      <rect x="16" y="122" width="204" height="58" rx="0"/><rect x="232" y="122" width="204" height="58" rx="0"/><rect x="480" y="122" width="200" height="58" rx="0"/><rect x="692" y="122" width="192" height="58" rx="0"/>
      <rect x="16" y="188" width="204" height="58" rx="0"/><rect x="232" y="188" width="204" height="58" rx="0"/><rect x="480" y="188" width="200" height="58" rx="0"/><rect x="692" y="188" width="192" height="58" rx="0"/></g>
    <g class="t"><text x="32" y="82">대시보드</text><text x="248" y="82">사용자 정보관리</text><text x="496" y="82">사용자 지원</text><text x="708" y="82">포털 관리</text>
