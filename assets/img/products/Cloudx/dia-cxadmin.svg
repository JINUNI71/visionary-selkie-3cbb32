    <rect x="0" y="336" width="900" height="48" fill="#b06000" opacity=".06"/>
    <text x="18" y="366" class="s" font-size="12.5" fill="#b06000">소프트웍스는 이 경계를 기관 조직 구조에 맞춰 설계하고, 필요한 기능은 포털 내에 직접 개발합니다.</text>
