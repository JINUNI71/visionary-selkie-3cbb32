    <text x="16" y="154" class="t">팜 A</text>
    <g fill="#0e8ba8" opacity=".22"><rect x="16" y="164" width="74" height="34" rx="0"/><rect x="100" y="164" width="74" height="34" rx="0"/><rect x="184" y="164" width="74" height="34" rx="0"/></g>
    <text x="272" y="178" class="s">호스트 3대</text>
