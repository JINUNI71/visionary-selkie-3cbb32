    <text x="16" y="359" fill="#b8c8e8" font="400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">호스트당 최대 세션 수는 레퍼런스 가정값이 아니라 PoC·BMT 실측으로 확정합니다</text>
