    <text x="628" y="212" class="s">목표 복구 시점 · 시간 단위</text>
    <rect x="0" y="244" width="900" height="62" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
    <text x="18" y="270" class="t">데이터스토어와 호스트가 달라도 그룹 안은 같은 시점으로 복구됩니다</text>
    <text x="18" y="292" class="s" font-size="12.5">도입이 실패하는 지점은 설치가 아니라 이 경계의 설정 기준입니다.</text>
  </svg>
