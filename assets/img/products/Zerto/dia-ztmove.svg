<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="이기종 전환 3단계">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect width="100%" height="100%" fill="#ffffff"/>
    <text x="0" y="14" class="l">이기종 전환: 보호 유지 상태로 이전</text>
    <g class="k"><rect x="0" y="26" width="286" height="92" rx="0"/><rect x="307" y="26" width="286" height="92" rx="0"/><rect x="614" y="26" width="286" height="92" rx="0"/></g>
    <text x="18" y="52" class="t" fill="#d93025">① 선행 요건 확인</text>
    <text x="325" y="52" class="t">② 복제 · 동기화</text>
    <text x="632" y="52" class="t">③ 컷오버</text>
    <g class="s" font-size="11.5">
      <text x="18" y="76">게스트 부팅 방식 · 드라이버</text><text x="18" y="96">지원 조합 검증</text>
      <text x="325" y="76">원래 사이트 보호 유지</text><text x="325" y="96">변경분만 지속 반영</text>
      <text x="632" y="76">짧은 정지 후 전환</text><text x="632" y="96">되돌릴 경로 확보</text></g>
    <g stroke="#d93025" stroke-width="1.3" opacity=".55" fill="none"><path d="M286 72h21M593 72h21"/><path d="M296 66l10 6-10 6M603 66l10 6-10 6"/></g>
    <rect x="0" y="142" width="900" height="66" fill="#FEF7E0" stroke="#EADBAE" stroke-width="1"/>
    <text x="18" y="168" class="t" fill="#6B4B08">지연은 복제가 아니라 선행 요건에서 발생합니다</text>
    <text x="18" y="192" class="s" font-size="12.5" fill="#8A6210">제품의 지원 범위와 현장 적용 가능 여부 사이에는 게스트 측 조건이 있으며, 그 목록을 계약 전에 먼저 확인합니다.</text>
    <rect x="0" y="228" width="900" height="66" fill="#d93025" opacity=".06"/>
    <text x="18" y="254" class="s" font-size="12.5" fill="#d93025">전환 중에도 원래 사이트 보호가 유지되므로, 문제 발생 시 되돌릴 수 있습니다.</text>
    <text x="18" y="278" class="s" font-size="12.5">되돌리는 경로를 계약 전에 확인하지 않으면 이관 후 선택이 제한됩니다.</text>
  </svg>
