<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="352" viewBox="-6 -6 912 352" role="img" aria-label="vSphere Foundation의 구성 범위와 Cloud Foundation 확장 경계">
    <defs><style>
      .l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.4px;fill:#80868b}
      .t{font:600 13.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}
      .s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}
      .k{fill:#fff;stroke:#dadce0;stroke-width:1}
      .w{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#fff}
    </style></defs><rect x="-6" y="-6" width="912" height="352" fill="#ffffff"/>
    <text x="0" y="14" class="l" fill="#1369ff">vSPHERE FOUNDATION (VVF) — 지금 구축하는 범위</text>
    <text x="560" y="14" class="l">CLOUD FOUNDATION — 나중에 확장하는 범위</text>
    <rect x="0" y="26" width="520" height="216" fill="#1369ff" opacity=".05"/>
    <rect x="0" y="26" width="520" height="216" fill="none" stroke="#1369ff" stroke-width="1"/>
    <g class="k"><rect x="18" y="44" width="232" height="56" rx="0"/><rect x="268" y="44" width="232" height="56" rx="0"/><rect x="18" y="112" width="232" height="56" rx="0"/><rect x="268" y="112" width="232" height="56" rx="0"/></g>
    <g class="t"><text x="34" y="68">vSphere</text><text x="284" y="68">vCenter</text><text x="34" y="136">vSAN</text><text x="284" y="136">VCF Operations</text></g>
    <g class="s"><text x="34" y="88">하이퍼바이저 · 클러스터</text><text x="284" y="88">중앙 관리 · 가용성</text><text x="34" y="156">서버 내장 디스크 공유</text><text x="284" y="156">자원 사용 · 용량 추이</text></g>
    <text x="18" y="196" class="s">가상화 · 스토리지 · 운영 관리까지를 하나의 묶음으로 제공합니다</text>
    <text x="18" y="218" class="s">네트워크 가상화와 셀프서비스가 필요해지는 시점이 전환 시점입니다</text>
    <rect x="560" y="26" width="340" height="216" fill="none" stroke="#dadce0" stroke-width="1" stroke-dasharray="4 4"/>
    <g class="k"><rect x="578" y="44" width="146" height="46" rx="0"/><rect x="738" y="44" width="144" height="46" rx="0"/><rect x="578" y="102" width="146" height="46" rx="0"/><rect x="738" y="102" width="144" height="46" rx="0"/></g>
    <g class="t" text-anchor="middle"><text x="651" y="72">NSX</text><text x="810" y="72">VCF Automation</text><text x="651" y="130">VKS</text><text x="810" y="130">Private AI</text></g>
    <text x="578" y="180" class="s">네 가지를 더하면 풀스택 프라이빗 클라우드가 됩니다</text>
    <g stroke="#1369ff" stroke-width="1.5" fill="none"><path d="M520 134h30"/><path d="M544 128l8 6-8 6"/></g>
    <text x="535" y="120" class="l" fill="#1369ff" text-anchor="middle">확장</text>
    <rect x="0" y="268" width="900" height="56" fill="#0e2244"/>
    <text x="18" y="292" class="w">지금 필요한 범위와 나중에 확장할 범위를 나눕니다</text>
    <text x="18" y="312" class="s" fill="rgba(255,255,255,.72)">초기 클러스터 경계와 네트워크 구성이 이후 확장 공수와 비용을 결정합니다.</text>
  </svg>
