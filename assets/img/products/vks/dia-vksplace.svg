<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="332" viewBox="-6 -6 912 332" role="img" aria-label="컨테이너 워크로드를 어디에 둘지 판단하는 기준">
    <defs><style>
      .l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.4px;fill:#80868b}
      .t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}
      .s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}
      .m{font:600 11px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f7b6c}
      .k{fill:#fff;stroke:#dadce0;stroke-width:1}
    </style></defs><rect x="-6" y="-6" width="912" height="332" fill="#ffffff"/>
    <text x="0" y="14" class="l">판단 기준</text>
    <g class="k"><rect x="0" y="24" width="286" height="78" rx="0"/><rect x="306" y="24" width="288" height="78" rx="0"/><rect x="614" y="24" width="286" height="78" rx="0"/></g>
    <g class="t"><text x="18" y="48">자원 공유</text><text x="324" y="48">수명 주기</text><text x="632" y="48">운영 조직</text></g>
    <g class="s">
      <text x="18" y="68">기존 vSphere 자원을 그대로</text><text x="18" y="86">쓰는 편이 유리한가</text>
      <text x="324" y="68">인프라와 같은 주기로</text><text x="324" y="86">업그레이드해도 되는가</text>
      <text x="632" y="68">인프라 운영 조직이</text><text x="632" y="86">함께 맡는가</text></g>
    <g stroke="#0f7b6c" stroke-width="1" opacity=".4"><path d="M450 102v22"/></g>
    <g class="k"><rect x="0" y="124" width="440" height="70" rx="0"/><rect x="460" y="124" width="440" height="70" rx="0"/></g>
    <rect x="0" y="124" width="440" height="70" fill="#0f7b6c" opacity=".05"/>
    <text x="20" y="150" class="t" fill="#0f7b6c">VKS에 둡니다</text>
    <text x="20" y="172" class="s">세 기준이 모두 해당하는 워크로드. 기존 인프라 자원 위에서 운영 창구를 하나로 모읍니다.</text>
    <text x="480" y="150" class="t">별도 클러스터에 둡니다</text>
    <text x="480" y="172" class="s">버전 주기가 다르거나 개발 조직이 직접 운영하는 워크로드.</text>
    <text x="0" y="230" class="l">배치를 정하는 순서</text>
    <g class="k"><rect x="0" y="240" width="286" height="62" rx="0"/><rect x="306" y="240" width="288" height="62" rx="0"/><rect x="614" y="240" width="286" height="62" rx="0"/></g>
    <g class="s">
      <text x="18" y="264">워크로드를 목록으로 만들고</text><text x="18" y="282">기준에 따라 분류합니다</text>
      <text x="324" y="264">분류 결과를 고객과 확정한 뒤</text><text x="324" y="282">배치를 결정합니다</text>
      <text x="632" y="264">배치 기준을 문서로 남겨</text><text x="632" y="282">이후 신규 워크로드에 적용합니다</text></g>
  </svg>
