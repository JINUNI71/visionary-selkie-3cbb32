<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="352" viewBox="-6 -6 912 352" role="img" aria-label="신청에서 할당까지의 흐름과 각 단계의 통제 지점">
    <defs><style>
      .l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.4px;fill:#80868b}
      .t{font:600 12.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}
      .s{font:400 11px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}
      .m{font:600 11px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0b7285}
      .k{fill:#fff;stroke:#dadce0;stroke-width:1}
      .w{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#fff}
    </style></defs><rect x="-6" y="-6" width="912" height="352" fill="#ffffff"/>
    <text x="0" y="14" class="l">사용자가 보는 흐름</text>
    <g class="k"><rect x="0" y="24" width="160" height="56" rx="0"/><rect x="185" y="24" width="160" height="56" rx="0"/><rect x="370" y="24" width="160" height="56" rx="0"/><rect x="555" y="24" width="160" height="56" rx="0"/><rect x="740" y="24" width="160" height="56" rx="0"/></g>
    <g class="t" text-anchor="middle"><text x="80" y="48">신청</text><text x="265" y="48">승인</text><text x="450" y="48">생성</text><text x="635" y="48">할당</text><text x="820" y="48">회수</text></g>
    <g class="s" text-anchor="middle">
      <text x="80" y="68">사유 · 사양 · 사용 환경</text><text x="265" y="68">결재선에 따라 처리</text>
      <text x="450" y="68">이미지 복제 · 초기 설정</text><text x="635" y="68">사용자에게 전달</text><text x="820" y="68">미사용 자원 반납</text></g>
    <g stroke="#0b7285" stroke-width="1.5" fill="none">
      <path d="M160 52h17M171 46l8 6-8 6"/><path d="M345 52h17M356 46l8 6-8 6"/>
      <path d="M530 52h17M541 46l8 6-8 6"/><path d="M715 52h17M726 46l8 6-8 6"/></g>
    <g stroke="#0b7285" stroke-width="1" opacity=".35" stroke-dasharray="3 3"><path d="M80 80v30M265 80v30M450 80v30M635 80v30M820 80v30"/></g>
    <text x="0" y="128" class="l" fill="#0b7285">관리자가 쥐고 있는 통제 지점</text>
    <g class="k"><rect x="0" y="138" width="160" height="74" rx="0"/><rect x="185" y="138" width="160" height="74" rx="0"/><rect x="370" y="138" width="160" height="74" rx="0"/><rect x="555" y="138" width="160" height="74" rx="0"/><rect x="740" y="138" width="160" height="74" rx="0"/></g>
    <g class="s">
      <text x="14" y="160">신청 양식 항목</text><text x="14" y="177">선택 가능한 사양</text><text x="14" y="194">사용 환경 구분</text>
      <text x="199" y="160">승인 라인</text><text x="199" y="177">부서장 · 인프라</text><text x="199" y="194">반려 사유 기록</text>
      <text x="384" y="160">승인된 이미지만</text><text x="384" y="177">명명 규칙</text><text x="384" y="194">네트워크 배정</text>
      <text x="569" y="160">역할별 권한</text><text x="569" y="177">직접 처리 범위</text><text x="569" y="194">콘솔 접속 허용 여부</text>
      <text x="754" y="160">미사용 판정 기준</text><text x="754" y="177">소유자 통보</text><text x="754" y="194">연장 · 반납 선택</text></g>
    <rect x="0" y="240" width="900" height="76" fill="#0e2244"/>
    <text x="18" y="264" class="w">여기가 설계 대상입니다</text>
    <text x="18" y="286" class="s" fill="rgba(255,255,255,.72)">신청을 빠르게 만드는 것은 제품이 합니다. 빨라진 신청이 구성을 제각각으로 흩어 놓지 않게 하는 것은 이 다섯 지점을 어떻게 잡느냐에 달려 있습니다.</text>
  </svg>
