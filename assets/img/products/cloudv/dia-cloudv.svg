    <g class="t" text-anchor="middle"><text x="143" y="344">노드</text><text x="450" y="344">공유 스토리지</text><text x="757" y="344">네트워크</text></g>
    <g class="s" text-anchor="middle"><text x="143" y="364">가상 머신이 올라가는 서버</text><text x="450" y="364">노드가 함께 쓰는 저장 공간</text><text x="757" y="364">가상 스위치로 구성</text></g>
    <text x="0" y="400" class="l">포털은 엔진을 통해서만 자원을 다룹니다. 엔진이 이미 하는 일을 포털에서 다시 만들지 않습니다</text>
