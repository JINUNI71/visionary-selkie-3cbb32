    </style></defs><rect x="-6" y="-6" width="912" height="422" fill="#ffffff"/>
    <text x="0" y="14" class="l">사용자</text>
    <g class="k"><rect x="0" y="24" width="286" height="44" rx="0"/><rect x="306" y="24" width="288" height="44" rx="0"/><rect x="614" y="24" width="286" height="44" rx="0"/></g>
    <g class="t" text-anchor="middle"><text x="143" y="51">개발 · 운영자</text><text x="450" y="51">인프라 관리자</text><text x="757" y="51">부서장 · 감사</text></g>
    <g class="s" text-anchor="middle" font-size="11"><text x="143" y="64">신청</text><text x="450" y="64">승인 · 운영</text><text x="757" y="64">조회 · 리포트</text></g>
    <g stroke="#0b7285" stroke-width="1" opacity=".4"><path d="M143 68v18M450 68v18M757 68v18"/></g>
    <rect x="0" y="86" width="900" height="96" fill="#0b7285" opacity=".06"/>
    <rect x="0" y="86" width="900" height="96" fill="none" stroke="#0b7285" stroke-width="1"/>
    <text x="18" y="108" class="l" fill="#0b7285">CLOUDV 포털 — 소프트웍스 자체 개발 · 국내 보안인증</text>
    <g class="k"><rect x="18" y="118" width="206" height="24" rx="0"/><rect x="236" y="118" width="206" height="24" rx="0"/><rect x="454" y="118" width="206" height="24" rx="0"/><rect x="672" y="118" width="210" height="24" rx="0"/></g>
    <g class="s" text-anchor="middle"><text x="121" y="134">VM 신청 · 승인</text><text x="339" y="134">VM 생성 · 관리</text><text x="557" y="134">인프라 환경 조회</text><text x="777" y="134">감사 로그 · 리포트</text></g>
    <text x="18" y="166" class="s">신청 양식 · 승인 라인 · 명명 규칙 · 역할별 화면 범위는 기관 기준에 맞춰 설계합니다</text>
    <g stroke="#0b7285" stroke-width="1.5" fill="none"><path d="M450 182v20M444 196l6 6 6-6"/></g>
    <text x="466" y="198" class="m">REST API</text>
    <rect x="0" y="210" width="900" height="68" fill="#0e2244"/>
    <text x="18" y="233" class="l" fill="#7ce9f5">HPE VM ESSENTIALS · VME MANAGER — 가상화 엔진</text>
