<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="가상 PC 자동 증설과 회수">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.4px;fill:#80868b}.t{font:600 13.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect width="100%" height="100%" fill="#ffffff"/>
    <text x="0" y="14" class="l">사전 생성된 대기 풀</text>
    <rect x="0" y="26" width="560" height="96" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
    <g fill="#b06000" opacity=".22"><rect x="16" y="42" width="40" height="28" rx="0"/><rect x="62" y="42" width="40" height="28" rx="0"/><rect x="108" y="42" width="40" height="28" rx="0"/><rect x="154" y="42" width="40" height="28" rx="0"/><rect x="200" y="42" width="40" height="28" rx="0"/><rect x="246" y="42" width="40" height="28" rx="0"/><rect x="292" y="42" width="40" height="28" rx="0"/><rect x="338" y="42" width="40" height="28" rx="0"/></g>
    <g fill="#fff" stroke="#dadce0" stroke-width="1"><rect x="384" y="42" width="40" height="28" rx="0"/><rect x="430" y="42" width="40" height="28" rx="0"/><rect x="476" y="42" width="40" height="28" rx="0"/></g>
    <text x="16" y="92" class="s">할당 완료</text>
    <text x="390" y="92" class="s">할당 대기: 즉시 배정 가능</text>
    <line x1="384" y1="34" x2="384" y2="112" stroke="#b06000" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="392" y="112" class="s" font-size="10.5" fill="#b06000">SPARE 기준선</text>
    <g class="k"><rect x="600" y="26" width="300" height="96" rx="0"/></g>
    <text x="618" y="50" class="t">임계값 3개</text>
    <g class="s"><text x="618" y="74">MAX: 증설 중단 상한</text><text x="618" y="94">MIN: 유지 대기 수량</text><text x="618" y="112">SPARE: 증설 개시 기준 여유분</text></g>
    <rect x="0" y="146" width="440" height="74" class="k"/>
    <text x="18" y="170" class="t" fill="#b06000">Scale Out</text>
    <text x="18" y="192" class="s">대기 풀이 SPARE 아래로 떨어지면</text>
    <text x="18" y="210" class="s">지정한 단위만큼 자동 생성</text>
    <rect x="460" y="146" width="440" height="74" class="k"/>
    <text x="478" y="170" class="t">Scale In</text>
    <text x="478" y="192" class="s">이용이 끝난 가상 PC는 자동 회수</text>
    <text x="478" y="210" class="s">초기화 후 대기 풀로 복귀</text>
    <rect x="0" y="244" width="900" height="50" fill="#b06000" opacity=".06"/>
    <text x="18" y="268" class="s" font-size="12.5" fill="#b06000">사용자는 생성 대기 없이 즉시 할당받습니다.</text>
    <text x="18" y="286" class="s" font-size="12" >임계값은 사업 규모와 접속 패턴에 맞춰 설정하며, 관리 포털에서 조정합니다.</text>
  </svg>
