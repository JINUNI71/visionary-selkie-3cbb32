<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="인라인 멀웨어 탐지와 불변 저장소">
    <defs><style>.l{font:600 10.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11.5px 'DM Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect width="100%" height="100%" fill="#ffffff"/>
    <text x="0" y="14" class="l">백업 스트림이 지나가는 동안</text>
    <g class="k"><rect x="0" y="26" width="180" height="56" rx="0"/><rect x="680" y="26" width="220" height="56" rx="0"/></g>
    <text x="18" y="50" class="t">운영 워크로드</text><text x="18" y="70" class="s">변경 블록</text>
    <text x="698" y="50" class="t">저장소</text><text x="698" y="70" class="s">복원 지점 누적</text>
    <rect x="250" y="20" width="360" height="68" fill="#1e8e3e" opacity=".07"/>
    <rect x="250" y="20" width="360" height="68" fill="none" stroke="#1e8e3e" stroke-width="1.2"/>
    <text x="268" y="44" class="t" fill="#1e8e3e">백업 프록시: 기록 중 판정</text>
    <text x="268" y="66" class="s">암호화 흔적 · 이상 변화 · 콘텐츠 검사</text>
    <text x="268" y="82" class="s">감도 단계 조절</text>
    <g stroke="#1e8e3e" stroke-width="1.6" fill="none"><path d="M180 54h70M610 54h70"/><path d="M232 48l10 6-10 6M662 48l10 6-10 6"/></g>
    <g class="k"><rect x="680" y="106" width="220" height="44" rx="0"/></g>
    <text x="698" y="126" class="s" font-size="11">정상 복원 지점</text>
    <rect x="680" y="160" width="220" height="44" fill="#FEF7E0" stroke="#EADBAE" stroke-width="1"/>
    <text x="698" y="180" class="s" font-size="11" fill="#8A6210">의심 표시된 복원 지점</text>
    <text x="698" y="196" class="s" font-size="10.5" fill="#8A6210">복구 후보에서 자동 제외</text>
    <rect x="0" y="120" width="620" height="84" class="k"/>
    <text x="18" y="146" class="t">불변 잠금</text>
    <text x="18" y="168" class="s" font-size="12.5">보존 기간 안에는 관리자 권한으로도 지울 수 없습니다.</text>
    <text x="18" y="190" class="s" font-size="12.5">백업이 존재하는 것과 지워지지 않는 것은 다른 문제입니다.</text>
    <rect x="0" y="228" width="900" height="66" fill="#1e8e3e" opacity=".06"/>
    <text x="18" y="254" class="s" font-size="12.5" fill="#1e8e3e">소프트웍스 수행 범위: 감도를 낮게 시작해 오탐 기준선을 설정한 뒤 단계적으로 상향합니다.</text>
    <text x="18" y="276" class="s" font-size="12.5">표시가 붙은 지점은 복구 후보에서 제외하고, 직전 정상 지점을 검증한 뒤에 복구 절차에 착수합니다.</text>
  </svg>
