<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="망분리 유형별 VDI 풀 구성">
    <defs><style>.l{font:600 10.5px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.4px;fill:#80868b}.t{font:600 13.5px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11.5px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}.k{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs><rect width="100%" height="100%" fill="#ffffff"/>
    <text x="0" y="14" class="l">인터넷 망분리: 인터넷 접근만 분리</text>
    <g class="k"><rect x="0" y="26" width="200" height="120" rx="0"/><rect x="220" y="26" width="200" height="120" rx="0"/></g>
    <text x="18" y="50" class="t">공용 풀</text><text x="18" y="68" class="s">VM : 사용자 = 1 : N</text>
    <text x="18" y="92" class="s">로그오프 시 초기화</text><text x="18" y="112" class="s">일반 사용자 · 집적도 우선</text>
    <text x="18" y="136" class="s" fill="#0e8ba8">비용 낮음</text>
    <text x="238" y="50" class="t">전용 풀</text><text x="238" y="68" class="s">VM : 사용자 = 1 : 1</text>
    <text x="238" y="92" class="s">개인 환경 유지</text><text x="238" y="112" class="s">인터넷 업무 상시 사용자</text>
    <text x="238" y="136" class="s" fill="#0e8ba8">자원 점유 높음</text>
    <text x="480" y="14" class="l">업무 망분리: 업무 성격별 분리</text>
    <g class="k"><rect x="480" y="26" width="130" height="120" rx="0"/><rect x="625" y="26" width="130" height="120" rx="0"/><rect x="770" y="26" width="130" height="120" rx="0"/></g>
    <g class="t"><text x="498" y="50">OA 업무</text><text x="643" y="50">개발</text><text x="788" y="50">콜센터</text></g>
    <g class="s"><text x="498" y="72">문서 · 메일</text><text x="643" y="72">소스 · 빌드</text><text x="788" y="72">상담 시스템</text>
      <text x="498" y="96">일반 정책</text><text x="643" y="96">반출 통제 강화</text><text x="788" y="96">고정 이미지</text></g>
    <g class="s" fill="#0e8ba8"><text x="498" y="136">업무별 정책 차등</text></g>
    <rect x="0" y="176" width="900" height="66" class="k"/>
    <text x="18" y="200" class="t">차단 지점의 위치가 규정 해석의 핵심</text>
    <g class="s" font-size="12.5"><text x="18" y="222">인터넷 망분리: 업무망 데스크톱의 인터넷 직접 접근을 차단하고 인터넷은 별도 풀에서만 제공</text>
      <text x="18" y="238">업무 망분리: 업무 성격이 다른 풀 사이의 횡적 이동을 차단하고 풀별로 통제 수준을 차등 적용</text></g>
    <rect x="0" y="262" width="900" height="58" fill="#0e8ba8" opacity=".06"/>
    <text x="18" y="286" class="s" font-size="12.5" fill="#0e8ba8">선택 기준: 보안 등급 · VM 집적도와 비용 · 사용자 업무 특성</text>
    <text x="18" y="306" class="s" font-size="12.5">업무 데스크톱에서 선택한 링크를 인터넷 풀에서 실행하는 URL 전달 구성도 함께 설계합니다.</text>
  </svg>
