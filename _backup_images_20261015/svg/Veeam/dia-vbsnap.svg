<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="스냅샷 수명 비교">
    <defs><style>.l{font:600 10.5px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:1.3px;fill:#80868b}.t{font:600 13px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#202124}.s{font:400 11px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#5f6368}</style></defs><rect width="100%" height="100%" fill="#ffffff"/>
    <text x="0" y="14" class="l">일반 백업: 백업 전 구간에 유지되는 스냅샷</text>
    <line x1="0" y1="96" x2="900" y2="96" stroke="#dadce0" stroke-width="1"/>
    <rect x="0" y="66" width="14" height="30" fill="#9aa0a6"/>
    <rect x="18" y="56" width="640" height="40" fill="#1e8e3e" opacity=".85"/>
    <text x="300" y="82" fill="#fff" font="600 12px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">백업 수행</text>
    <rect x="662" y="46" width="120" height="50" fill="#b06000" opacity=".8"/>
    <text x="676" y="76" fill="#fff" font="600 12px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">스냅샷 커밋</text>
    <g stroke="#5f6368" stroke-width="1" stroke-dasharray="4 3"><path d="M7 30v36M782 30v16"/></g>
    <g stroke="#5f6368" stroke-width="1.4" fill="none"><path d="M7 30h775"/><path d="M18 24l-11 6 11 6M771 24l11 6-11 6"/></g>
    <text x="300" y="24" class="t">백업 전 구간에 걸친 스냅샷 수명</text>
    <text x="0" y="112" class="s">백업이 길어질수록 커밋 시 발생하는 I/O가 커집니다.</text>
    <text x="0" y="150" class="l" fill="#1e8e3e">스토리지 스냅샷 연동: 생성 직후 커밋</text>
    <line x1="0" y1="232" x2="900" y2="232" stroke="#dadce0" stroke-width="1"/>
    <rect x="0" y="202" width="12" height="30" fill="#9aa0a6"/>
    <rect x="16" y="192" width="46" height="40" fill="#b06000" opacity=".8"/>
    <rect x="70" y="192" width="700" height="40" fill="#1e8e3e" opacity=".85"/>
    <text x="360" y="218" fill="#fff" font="600 12px "DM Sans",'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">백업 수행: 어레이 스냅샷에서 읽기</text>
    <g stroke="#1e8e3e" stroke-width="1.4" fill="none"><path d="M6 174h56"/><path d="M52 168l10 6-10 6"/></g>
    <text x="72" y="178" class="t" fill="#1e8e3e">생성부터 커밋까지의 스냅샷 수명</text>
    <rect x="0" y="256" width="900" height="40" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
    <text x="18" y="281" class="s" font-size="12.5">축 단위 없는 상대 비교입니다. 실제 폭은 어레이 구성에 따라 달라지므로 적용 전후 지연시간을 같은 작업으로 측정해 남깁니다.</text>
  </svg>
