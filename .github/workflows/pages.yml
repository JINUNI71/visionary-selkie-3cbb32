# main 에 push 하면 build.sh 로 dist/ 를 만들어 GitHub Pages 에 올립니다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 선택하십시오.
name: 홈페이지 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 (검토용 — 정식 공개 때는 bash build.sh --public)
        run: bash build.sh

      - name: 404 페이지 경로를 저장소 주소에 맞춤
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}"
          sed -i "s#\(href\|src\)=\"/#\1=\"$BASE/#g" dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
